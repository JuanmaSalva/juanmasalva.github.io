<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto | Juan Manuel Salvá</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050510;
            --cyan: #00f5d4;
            --magenta: #f72585;
            --purple: #7b2fff;
            --text: #e0e0ff;
            --card-bg: rgba(8, 8, 25, 0.85);
            --border: rgba(0, 245, 212, 0.15);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            cursor: none;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
            );
        }

        /* ── Cursor ── */
        #cursor {
            position: fixed;
            width: 22px; height: 22px;
            border: 1.5px solid var(--cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s ease, border-color 0.3s;
            mix-blend-mode: exclusion;
        }
        #cursor-dot {
            position: fixed;
            width: 4px; height: 4px;
            background: var(--cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }
        #cursor.hover { transform: scale(2.2); border-color: var(--magenta); }

        /* ── Nav ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.4rem 4rem;
            background: rgba(5,5,16,0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-left { display: flex; align-items: center; gap: 2rem; }

        .back-link {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 2px;
            color: rgba(224,224,255,0.5);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-link:hover { color: var(--cyan); }
        .back-link::before { content: '←'; font-size: 1rem; }

        .nav-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 3px;
        }
        .nav-logo em { color: var(--cyan); font-style: normal; }

        /* ── Hero ── */
        #project-hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 8% 6rem;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.3s forwards;
        }

        .hero-year {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: rgba(224,224,255,0.4);
            text-transform: uppercase;
        }

        .hero-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 2px;
            padding: 0.2rem 0.8rem;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            text-transform: uppercase;
        }
        .hero-status.done { border-color: var(--magenta); color: var(--magenta); }

        .hero-icon-big {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.5s forwards;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2.5rem, 8vw, 6rem);
            line-height: 1;
            color: #fff;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.6s forwards;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.8s forwards;
        }

        .tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            padding: 0.3rem 0.8rem;
            border: 1px solid rgba(0,245,212,0.3);
            color: var(--cyan);
            text-transform: uppercase;
        }
        .tag.pink   { border-color: rgba(247,37,133,0.3);  color: var(--magenta); }
        .tag.purple { border-color: rgba(123,47,255,0.3);  color: var(--purple);  }

        .hero-links {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.7s ease 1s forwards;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.9rem 2.2rem;
            text-decoration: none;
            clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
            transition: all 0.3s;
            display: inline-block;
        }
        .btn-fill    { background: var(--cyan); color: #050510; }
        .btn-fill:hover    { background: var(--magenta); transform: translateY(-3px); }
        .btn-outline { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); }
        .btn-outline:hover { background: rgba(0,245,212,0.08); transform: translateY(-3px); }

        /* ── Sections ── */
        section {
            position: relative;
            z-index: 1;
            padding: 7rem 8%;
        }

        .section-eyebrow {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--magenta);
            margin-bottom: 0.6rem;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 2rem);
            color: #fff;
            margin-bottom: 0.8rem;
        }

        .section-rule {
            width: 55px; height: 2px;
            background: linear-gradient(to right, var(--cyan), var(--purple));
            margin-bottom: 3rem;
        }

        /* ── Overview ── */
        #overview { background: rgba(5,5,16,0.6); backdrop-filter: blur(6px); }

        .overview-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-bottom: 3rem;
            display: block;
        }

        .overview-placeholder {
            width: 100%;
            height: 280px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }
        .overview-placeholder::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(0,245,212,0.02) 20px,
                rgba(0,245,212,0.02) 40px
            );
        }
        .placeholder-icon { font-size: 3.5rem; opacity: 0.3; }
        .placeholder-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 3px;
            color: rgba(224,224,255,0.2);
            text-transform: uppercase;
        }

        .overview-text p {
            color: rgba(224,224,255,0.72);
            line-height: 1.95;
            font-size: 1.05rem;
            margin-bottom: 1.4rem;
            max-width: 780px;
        }

        /* ── Highlights ── */
        #highlights { background: rgba(5,5,16,0.4); }

        .highlights-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.2rem;
        }

        .highlight-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--cyan);
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s;
        }
        .highlight-item.visible { opacity: 1; transform: translateX(0); }
        .highlight-item:hover { border-color: rgba(0,245,212,0.5); border-left-color: var(--magenta); }

        .highlight-bullet {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: var(--cyan);
            margin-top: 0.25rem;
            flex-shrink: 0;
        }

        .highlight-text {
            font-size: 0.95rem;
            color: rgba(224,224,255,0.75);
            line-height: 1.65;
        }

        /* ── Tech ── */
        #tech { background: rgba(5,5,16,0.65); backdrop-filter: blur(8px); }

        .tech-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .tech-pill {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 2px;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(0,245,212,0.25);
            color: var(--cyan);
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .tech-pill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--cyan);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
            z-index: -1;
        }
        .tech-pill:hover { color: #050510; border-color: var(--cyan); }
        .tech-pill:hover::before { transform: scaleX(1); }

        /* ── Not found ── */
        .not-found {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 2rem;
            padding: 2rem;
        }
        .not-found h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 4rem);
            color: var(--magenta);
        }
        .not-found p {
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            color: rgba(224,224,255,0.4);
        }

        /* ── Footer ── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 1.8rem;
            border-top: 1px solid var(--border);
            background: rgba(5,5,16,0.95);
        }
        footer p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 2.5px;
            color: rgba(224,224,255,0.2);
            text-transform: uppercase;
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            nav { padding: 1.2rem 2rem; }
            section { padding: 5rem 6%; }
            #project-hero { padding: 0 6% 5rem; }
        }
        @media (max-width: 600px) {
            .highlights-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div class="scanlines"></div>
    <canvas id="bg-canvas"></canvas>

    <nav>
        <div class="nav-left">
            <a href="index.html" class="back-link">Back</a>
            <a href="index.html" class="nav-logo">JMS<em>.</em></a>
        </div>
    </nav>

    <!-- Content injected by JS -->
    <div id="page-content"></div>

    <footer>
        <p>© 2026 Juan Manuel Salvá · Game Developer · Palma de Mallorca, Spain</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../data/data.js"></script>
    <script>
    /* ═══════════════════════════════════════════════════════════
       CSV PARSER (same as index.html)
    ═══════════════════════════════════════════════════════════ */
    function parseCSV(text) {
        const lines = text.replace(/\r/g, '').trim().split('\n');
        const headers = parseLine(lines[0]);
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const vals = parseLine(lines[i]);
            const obj = {};
            headers.forEach((h, j) => { obj[h.trim()] = (vals[j] ?? '').trim(); });
            rows.push(obj);
        }
        return rows;
    }

    function parseLine(line) {
        const result = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
                if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
            } else if (c === ',' && !inQ) {
                result.push(cur); cur = '';
            } else {
                cur += c;
            }
        }
        result.push(cur);
        return result;
    }

    function parseTags(str) {
        return str.split('|').filter(Boolean).map(t => {
            const [name, color = ''] = t.split(':');
            return { name: name.trim(), color: color.trim() };
        });
    }

    /* ═══════════════════════════════════════════════════════════
       LOAD & RENDER PROJECT
    ═══════════════════════════════════════════════════════════ */
    function init() {
        const params    = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const container = document.getElementById('page-content');

        if (!projectId) {
            window.location.href = 'index.html';
            return;
        }

        const projects = parseCSV(PROJECTS_CSV);
        renderProject(projects, projectId, container);
    }

    function renderProject(projects, projectId, container) {
        const project = projects.find(p => p.id === projectId);

        if (!project) {
            container.innerHTML = notFoundHTML(`Proyecto "${projectId}" no encontrado.`);
            return;
        }

        /* Update page title */
        document.title = `${project.name} | Juan Manuel Salvá`;

        /* Build page */
        const tags       = parseTags(project.tags);
        const techList   = project.tech.split('|').filter(Boolean);
        const highlights = project.highlights.split('|').filter(Boolean);
        const paragraphs = project.long_desc.split('||').filter(Boolean);
        const isDone     = project.status.toLowerCase().includes('complet');

        container.innerHTML = `
            <!-- Hero -->
            <section id="project-hero">
                <div class="hero-meta">
                    <span class="hero-year">${project.year}</span>
                    <span class="hero-status ${isDone ? 'done' : ''}">${project.status}</span>
                </div>
                <div class="hero-icon-big">${project.icon}</div>
                <h1 class="hero-title">${project.name}</h1>
                <div class="hero-tags">
                    ${tags.map(t => `<span class="tag ${t.color}">${t.name}</span>`).join('')}
                </div>
                ${(project.github || project.demo) ? `
                <div class="hero-links">
                    ${project.github ? `<a href="${project.github}" target="_blank" rel="noopener" class="btn btn-fill">GitHub →</a>` : ''}
                    ${project.demo   ? `<a href="${project.demo}"   target="_blank" rel="noopener" class="btn btn-outline">Demo →</a>` : ''}
                </div>` : ''}
            </section>

            <!-- Overview -->
            <section id="overview">
                <div class="section-eyebrow">// Overview</div>
                <h2 class="section-title">About the project</h2>
                <div class="section-rule"></div>
                <div class="reveal">
                    ${project.image
                        ? `<img src="${project.image}" alt="${project.name}" class="overview-image">`
                        : `<div class="overview-placeholder">
                               <div class="placeholder-icon">${project.icon}</div>
                               <span class="placeholder-text">Project image</span>
                           </div>`
                    }
                    <div class="overview-text">
                        ${paragraphs.map(p => `<p>${p.trim()}</p>`).join('')}
                    </div>
                </div>
            </section>

            <!-- Highlights -->
            <section id="highlights">
                <div class="section-eyebrow">// Contribution</div>
                <h2 class="section-title">What I built</h2>
                <div class="section-rule"></div>
                <ul class="highlights-list" id="highlights-list">
                    ${highlights.map((h, i) => `
                        <li class="highlight-item" style="transition-delay:${i * 0.08}s">
                            <span class="highlight-bullet">▸</span>
                            <span class="highlight-text">${h.trim()}</span>
                        </li>`).join('')}
                </ul>
            </section>

            <!-- Tech Stack -->
            <section id="tech">
                <div class="section-eyebrow">// Stack</div>
                <h2 class="section-title">Technologies</h2>
                <div class="section-rule"></div>
                <div class="tech-grid reveal">
                    ${techList.map(t => `<span class="tech-pill">${t.trim()}</span>`).join('')}
                </div>
            </section>`;

        /* Scroll reveal */
        const revealObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal, .highlight-item').forEach(el => revealObs.observe(el));

        /* Cursor hover on links */
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => cursorEl.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursorEl.classList.remove('hover'));
        });
    }

    function notFoundHTML(msg) {
        return `<div class="not-found">
            <h1>PROJECT_NOT_FOUND</h1>
            <p>${msg}</p>
            <a href="index.html" class="btn btn-outline" style="margin-top:1rem">← Back to portfolio</a>
        </div>`;
    }

    init();

    /* ═══════════════════════════════════════════════════════════
       CUSTOM CURSOR
    ═══════════════════════════════════════════════════════════ */
    const cursorEl  = document.getElementById('cursor');
    const cursorDot = document.getElementById('cursor-dot');
    let cx = 0, cy = 0, tx = 0, ty = 0;

    document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });

    (function trackCursor() {
        cx += (tx - cx) * 0.14;
        cy += (ty - cy) * 0.14;
        cursorEl.style.cssText  = `left:${cx - 11}px;top:${cy - 11}px`;
        cursorDot.style.cssText = `left:${tx - 2}px;top:${ty - 2}px`;
        requestAnimationFrame(trackCursor);
    })();

    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => cursorEl.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursorEl.classList.remove('hover'));
    });

    /* ═══════════════════════════════════════════════════════════
       THREE.JS — lightweight version (no central object)
    ═══════════════════════════════════════════════════════════ */
    const canvas   = document.getElementById('bg-canvas');
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    camera.position.z = 14;

    /* Stars */
    const starCount = 2000;
    const starPos   = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = 12 + Math.random() * 28;
        starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        starPos[i*3+2] = r * Math.cos(phi);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
        size: 0.07, color: 0x00f5d4, transparent: true, opacity: 0.45, sizeAttenuation: true
    }));
    scene.add(starField);

    /* Accent particles */
    const acc = new Float32Array(600 * 3);
    for (let i = 0; i < 600 * 3; i++) acc[i] = (Math.random() - 0.5) * 55;
    const accGeo = new THREE.BufferGeometry();
    accGeo.setAttribute('position', new THREE.BufferAttribute(acc, 3));
    scene.add(new THREE.Points(accGeo, new THREE.PointsMaterial({
        size: 0.04, color: 0xf72585, transparent: true, opacity: 0.2, sizeAttenuation: true
    })));

    /* Floating shapes */
    const floaters = [];
    const fGeos = [
        new THREE.OctahedronGeometry(0.28),
        new THREE.TetrahedronGeometry(0.24),
        new THREE.BoxGeometry(0.28, 0.28, 0.28),
        new THREE.IcosahedronGeometry(0.22, 0),
    ];
    for (let i = 0; i < 10; i++) {
        const wg   = new THREE.WireframeGeometry(fGeos[i % fGeos.length]);
        const mat  = new THREE.LineBasicMaterial({ color: i % 2 === 0 ? 0x00f5d4 : 0xf72585, transparent: true, opacity: 0.3 });
        const mesh = new THREE.LineSegments(wg, mat);
        mesh.position.set(
            (Math.random() - 0.5) * 22,
            (Math.random() - 0.5) * 14,
            (Math.random() - 0.5) * 8 - 3
        );
        mesh.userData = {
            rx: (Math.random() - 0.5) * 0.018,
            ry: (Math.random() - 0.5) * 0.018,
            oy: mesh.position.y,
            fs: 0.004 + Math.random() * 0.006,
            fp: Math.random() * Math.PI * 2,
        };
        scene.add(mesh);
        floaters.push(mesh);
    }

    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    document.addEventListener('mousemove', e => {
        mouse.tx = (e.clientX / innerWidth)  * 2 - 1;
        mouse.ty = -(e.clientY / innerHeight) * 2 + 1;
    }, { passive: true });

    let scrollY = 0;
    window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });

    const clock = new THREE.Clock();

    (function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;

        starField.rotation.y = t * 0.025;
        starField.rotation.x = t * 0.008;

        floaters.forEach(f => {
            const d = f.userData;
            f.rotation.x += d.rx;
            f.rotation.y += d.ry;
            f.position.y  = d.oy + Math.sin(t * d.fs * 100 + d.fp) * 0.45;
        });

        camera.position.x += (mouse.x * 1.5 - camera.position.x) * 0.03;
        camera.position.y += (mouse.y * 0.8 - camera.position.y) * 0.03;
        camera.position.z  = 14 + scrollY * 0.003;

        renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    </script>
</body>
</html>
